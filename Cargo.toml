[package]
name = "fishing-examples"
version = "0.2.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/urcades/fishing-examples"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
fishing = { version = "=0.2.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
